# =========================================================================
# AmratGames.com — High-Performance Nginx Reverse Proxy & Static Cache
# Optimized for Ubuntu VPS / Docker Deployments
# =========================================================================

# Upstream Backend Pool
upstream amrat_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

# Upstream Sovereign Payment Gateway Pools (YouPI-PG)
upstream youpi_backend {
    server 127.0.0.1:6100;
    keepalive 32;
}

upstream youpi_checkout {
    server 127.0.0.1:7000;
    keepalive 32;
}

upstream youpi_admin {
    server 127.0.0.1:6001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Client body limit for high-throughput
    client_max_body_size 25M;

    # Reverse Proxy: Sovereign UPI Customer Checkout UI
    location ^~ /checkout/ {
        proxy_pass http://youpi_checkout/checkout/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Reverse Proxy: Sovereign UPI Client SDK
    location = /youpi.js {
        proxy_pass http://youpi_checkout/youpi.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy: UPI Banking App Icons & Dynamic QR
    location ^~ /icons/ {
        proxy_pass http://youpi_checkout/icons/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
    }

    # Reverse Proxy: Sovereign Payment Gateway REST Core API & Polling
    location ^~ /api/v1/ {
        proxy_pass http://youpi_backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Reverse Proxy: Sovereign Gateway Merchant Admin Dashboard
    location ^~ /youpi-admin/ {
        proxy_pass http://youpi_admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy: Backend REST APIs
    location /api/ {
        proxy_pass http://amrat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Reverse Proxy: Live WebSocket (Community Bets, Airdrop Ticker)
    location /ws {
        proxy_pass http://amrat_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static Assets Caching (Vite hashed bundles)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Catch-All Route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health Check
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }
}

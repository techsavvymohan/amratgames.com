name: 🚀 AmratGames CD (Continuous Deployment)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip CI quality gate (Emergency Hotfix)'
        required: false
        type: boolean
        default: false

# Prevent concurrent deployments and auto-cancel obsolete pending runs
concurrency:
  group: production-vps-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Production CI Gate ──────────────────────────────────
  ci-gate:
    name: 🛡️ Pre-Deployment Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: 🟢 Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: 📥 Checkout YouPI Gateway Service (Integration Suite)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: youpi-pg/YouPI-PG
          path: gateway-service/youpi-pg

      - name: 🔗 Setup Gateway Service
        continue-on-error: true
        run: |
          if [ -d "gateway-service/youpi-pg" ]; then
            cd gateway-service/youpi-pg
            npm install --omit=dev --no-audit --no-fund
            node scripts/sync-merchant-vpa.js
          fi

      - name: 🛡️ Syntax & Static Code Check
        run: pnpm run check

      - name: 🎰 Backend Integrity & Provably Fair Tests
        run: pnpm run test:backend
        env:
          YOUPI_PG_ROOT: ${{ github.workspace }}/gateway-service/youpi-pg

      - name: 🎨 Frontend UI & Analytics Tests
        run: pnpm run test:frontend

      - name: 🏗️ Verify Frontend Production Build
        run: pnpm run build:frontend

  # ── 2. Deploy to Ubuntu Production VPS ─────────────────────
  deploy-to-vps:
    name: 🌐 Deploy to Ubuntu VPS (103.216.168.84)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci-gate
    if: |
      always() &&
      (needs.ci-gate.result == 'success' || inputs.skip_tests == true)
    steps:
      - name: 📥 Checkout Repository (For Scripts & Meta)
        uses: actions/checkout@v4

      - name: 🔐 Execute Zero-Downtime Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            echo "======================================================"
            echo "👑 Deploying AmratGames.com to Production VPS"
            echo "======================================================"
            mkdir -p /var/www/amratgames.com
            cd /var/www/amratgames.com

            # Ensure safe directory for git
            git config --global --add safe.directory /var/www/amratgames.com || true

            # Initialize git repository if missing
            if [ ! -d "/var/www/amratgames.com/.git" ]; then
              echo "▶ Initializing repository on VPS..."
              git init
              git remote add origin https://github.com/${{ github.repository }}.git 2>/dev/null || true
            fi

            # Sync exact verified commit using the ephemeral GitHub token
            echo "▶ Syncing commit ${{ github.sha }} from GitHub..."
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" || true
            git fetch --depth=1 origin "${{ github.sha }}" || git fetch origin main
            git checkout -f -B main FETCH_HEAD || git checkout -f main

            # Execute production deployment runner
            chmod +x scripts/deploy-vps.sh
            bash scripts/deploy-vps.sh

  # ── 3. Post-Deployment Smoke Test & Summary ───────────────
  smoke-test:
    name: 🩺 Live Health Check & Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy-to-vps
    steps:
      - name: 📡 Verify Live API Health Endpoint
        run: |
          echo "Waiting 5 seconds for proxy warm-up..."
          sleep 5
          TARGET_HOST="${{ secrets.VPS_HOST || '103.216.168.84' }}"
          echo "Pinging http://${TARGET_HOST}/api/health..."
          curl --fail --retry 5 --retry-delay 3 --max-time 15 -s "http://${TARGET_HOST}/api/health" || {
            echo "Direct IP health ping returned error, trying domain https://amratgames.com/api/health..."
            curl --fail --retry 3 --retry-delay 2 --max-time 15 -s "https://amratgames.com/api/health"
          }

      - name: 📝 Generate Deployment Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 👑 AmratGames.com — Production Deployment Report

          | Metric | Status / Value |
          | :--- | :--- |
          | **Status** | 🟢 **SUCCESSFUL & LIVE** |
          | **Commit** | \`${{ github.sha }}\` |
          | **Triggered By** | @${{ github.actor }} |
          | **Target Server** | Ubuntu VPS (\`${{ secrets.VPS_HOST || '103.216.168.84' }}\`) |
          | **Process Manager** | PM2 (\`amratgames-backend\`) |
          | **Web Server** | Nginx Reverse Proxy |
          | **Frontend URL** | [http://${{ secrets.VPS_HOST || '103.216.168.84' }}](http://${{ secrets.VPS_HOST || '103.216.168.84' }}) |
          | **API Health** | [http://${{ secrets.VPS_HOST || '103.216.168.84' }}/api/health](http://${{ secrets.VPS_HOST || '103.216.168.84' }}/api/health) |
          | **Live WebSocket** | \`ws://${{ secrets.VPS_HOST || '103.216.168.84' }}/ws\` |

          ### 🚀 Deployed Components:
          - ✅ Frontend Vite build compiled to \`/var/www/amratgames.com/frontend/dist\`
          - ✅ Backend PM2 cluster reloaded with zero-downtime
          - ✅ Nginx configuration tested and reloaded
          - ✅ Provably Fair HMAC-SHA256 game mechanics verified
          EOF

name: 🧪 AmratGames CI (Continuous Integration)

on:
  push:
    branches:
      - '**'
      - '!main' # Main deployments are handled by deploy.yml
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Code Quality & Syntax Check ────────────────────────
  code-quality:
    name: 🔍 Syntax & Environment Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: 🟢 Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚙️ Verify Environment Generator
        run: node scripts/setup-env.js

      - name: 🛡️ Syntax & Static Code Check
        run: pnpm run check

  # ── 2. Automated Test Suites ──────────────────────────────
  automated-tests:
    name: 🧪 Unit & Fairness Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: code-quality
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: 🟢 Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎰 Backend Integrity & Provably Fair Tests
        run: pnpm run test:backend

      - name: 🎨 Frontend UI & Analytics Tests
        run: pnpm run test:frontend

  # ── 3. Frontend Production Build Validation ──────────────
  build-validation:
    name: 🏗️ Frontend Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: code-quality
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: 🟢 Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Build Frontend Production Bundle
        run: pnpm run build:frontend

      - name: 📑 Verify Distribution Artifacts
        run: |
          test -f frontend/dist/index.html || { echo "❌ Missing dist/index.html"; exit 1; }
          echo "✅ Production bundle generated successfully: $(ls -lh frontend/dist/index.html | awk '{print $5}')"

  # ── 4. Docker Container Build Verification ───────────────
  docker-validation:
    name: 🐳 Docker Container Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: code-quality
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ⚙️ Build Backend Docker Image (Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: amratgames-backend:ci-test

      - name: ⚙️ Build Frontend Docker Image (Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: amratgames-frontend:ci-test

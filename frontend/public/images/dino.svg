<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="100%" height="100%">
  <defs>
    <!-- Night desert sky gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091224"/>
      <stop offset="60%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#1f2c4c"/>
    </linearGradient>

    <!-- Desert sand ground gradient -->
    <linearGradient id="sandGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Glowing Moon -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="moonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dino Green Gradient -->
    <linearGradient id="dinoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="dinoBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dinoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Night Sky -->
  <rect width="450" height="600" fill="url(#nightSky)"/>

  <!-- Gentle Stars -->
  <circle cx="60" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="120" cy="140" r="2" fill="#fef08a" opacity="0.9"/>
  <circle cx="180" cy="70" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="280" cy="110" r="1.8" fill="#ffffff" opacity="0.75"/>
  <circle cx="340" cy="60" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="400" cy="130" r="2" fill="#ffffff" opacity="0.85"/>
  <circle cx="70" cy="220" r="1.2" fill="#ffffff" opacity="0.5"/>

  <!-- Glowing Crescent Moon (Top Right) -->
  <g transform="translate(360, 110)" filter="url(#moonBlur)">
    <circle cx="0" cy="0" r="38" fill="url(#moonGlow)"/>
    <circle cx="12" cy="-6" r="34" fill="#0c172e"/>
  </g>

  <!-- Distant Desert Dunes (Layer 1) -->
  <path d="M 0 420 Q 140 370 280 410 T 450 390 L 450 600 L 0 600 Z" fill="#2d2b45" opacity="0.5"/>

  <!-- Desert Ground Platform (Layer 2) -->
  <path d="M 0 450 Q 180 430 450 440 L 450 600 L 0 600 Z" fill="url(#sandGround)"/>
  <!-- Track highlight line -->
  <path d="M 0 450 Q 180 430 450 440" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Desert Ground Texture Dash Lines -->
  <line x1="40" y1="480" x2="110" y2="480" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="220" y1="495" x2="310" y2="495" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="360" y1="475" x2="420" y2="475" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="530" x2="180" y2="530" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="260" y1="540" x2="380" y2="540" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- CACTUS OBSTACLE (Right Side) -->
  <g transform="translate(360, 420)">
    <!-- Main stem -->
    <rect x="-8" y="-70" width="16" height="70" rx="8" fill="#15803d" stroke="#166534" stroke-width="2"/>
    <!-- Left branch -->
    <path d="M -8 -45 L -24 -45 Q -32 -45 -32 -55 L -32 -75 Q -32 -82 -24 -82 Q -16 -82 -16 -75 L -16 -58 L -8 -58 Z" fill="#15803d" stroke="#166534" stroke-width="1.5"/>
    <!-- Right branch -->
    <path d="M 8 -30 L 24 -30 Q 32 -30 32 -40 L 32 -60 Q 32 -67 24 -67 Q 16 -67 16 -60 L 16 -43 L 8 -43 Z" fill="#15803d" stroke="#166534" stroke-width="1.5"/>
  </g>

  <!-- CHARMING GREEN T-REX RUNNER (Leaping Forward) -->
  <g transform="translate(160, 340)" filter="url(#dinoShadow)">
    <!-- Tail -->
    <path d="M -70 20 Q -110 30 -125 -10 Q -95 -5 -60 5 Z" fill="url(#dinoSkin)"/>

    <!-- Main Body -->
    <ellipse cx="-20" cy="10" rx="60" ry="48" fill="url(#dinoSkin)"/>
    <!-- Cute Belly -->
    <ellipse cx="-5" cy="20" rx="35" ry="32" fill="url(#dinoBelly)"/>

    <!-- Head & Snout -->
    <path d="M 0 -30 Q -10 -65 30 -65 L 75 -65 Q 90 -65 90 -45 L 90 -25 Q 90 -10 65 -10 L 30 -10 Q 15 -10 0 -30 Z" fill="url(#dinoSkin)"/>

    <!-- Open Happy Mouth -->
    <path d="M 35 -16 L 85 -16 L 75 -5 L 35 -5 Z" fill="#ef4444"/>
    <!-- Cute white teeth -->
    <polygon points="45,-16 50,-11 55,-16" fill="#ffffff"/>
    <polygon points="60,-16 65,-11 70,-16" fill="#ffffff"/>

    <!-- Big Cute Eye -->
    <circle cx="36" cy="-45" r="11" fill="#ffffff"/>
    <circle cx="39" cy="-45" r="6" fill="#0f172a"/>
    <circle cx="41" cy="-47" r="2.5" fill="#ffffff"/>

    <!-- Cute little arm reaching forward -->
    <path d="M 25 5 Q 45 5 48 15 Q 40 22 25 15 Z" fill="url(#dinoSkin)"/>

    <!-- Left Leg (Trailing back in run) -->
    <path d="M -50 35 Q -70 70 -85 75 Q -90 90 -75 88 Q -55 82 -35 45 Z" fill="#15803d"/>
    <!-- Orange Running Shoe / Foot -->
    <ellipse cx="-82" cy="84" rx="14" ry="7" fill="#f97316"/>

    <!-- Right Leg (Forward leap) -->
    <path d="M -10 40 Q 5 80 15 95 Q 22 105 35 100 Q 30 85 10 45 Z" fill="url(#dinoSkin)"/>
    <!-- Orange Running Shoe / Foot -->
    <ellipse cx="28" cy="98" rx="16" ry="8" fill="#f97316"/>
  </g>

  <!-- Speed Dust Particles Under Dino -->
  <circle cx="70" cy="445" r="6" fill="#fde68a" opacity="0.6"/>
  <circle cx="95" cy="448" r="4" fill="#fde68a" opacity="0.5"/>
  <circle cx="50" cy="450" r="3" fill="#fde68a" opacity="0.4"/>
</svg>

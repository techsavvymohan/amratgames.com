<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#16152b"/>
      <stop offset="60%" stop-color="#0e0d1c"/>
      <stop offset="100%" stop-color="#06060c"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="450" height="600" fill="url(#cyberBg)"/>

  <!-- Header Branding -->
  <g transform="translate(225, 75)">
    <rect x="-85" y="-26" width="170" height="30" rx="15" fill="rgba(0, 230, 118, 0.15)" stroke="#00e676" stroke-width="1.2"/>
    <text x="0" y="-6" text-anchor="middle" fill="#00e676" font-family="sans-serif" font-size="13" font-weight="800" letter-spacing="2">
      VIRAL FAST BETTING
    </text>
    <text x="0" y="44" text-anchor="middle" fill="#ffffff" font-family="'Impact', sans-serif" font-size="46" font-weight="900" letter-spacing="2">
      COLOR MATCH
    </text>
  </g>

  <!-- Glowing Tri-Color Wheel -->
  <g transform="translate(225, 275)">
    <!-- Outer Gold Ring -->
    <circle cx="0" cy="0" r="116" fill="none" stroke="#ffd700" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="110" fill="#0b0b14"/>

    <!-- 3 Segments: Green (120°), Violet (120°), Red (120°) -->
    <!-- Red Segment (Top Right) -->
    <path d="M 0 0 L 0 -105 A 105 105 0 0 1 90.9 52.5 Z" fill="#ff1744"/>
    <!-- Violet Segment (Bottom) -->
    <path d="M 0 0 L 90.9 52.5 A 105 105 0 0 1 -90.9 52.5 Z" fill="#7c4dff"/>
    <!-- Green Segment (Top Left) -->
    <path d="M 0 0 L -90.9 52.5 A 105 105 0 0 1 0 -105 Z" fill="#00e676"/>

    <!-- Center Roulette Core -->
    <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#ffd700" stroke-width="3" filter="url(#neonGlow)"/>
    <text x="0" y="10" text-anchor="middle" fill="#ffd700" font-family="'Impact', sans-serif" font-size="30" font-weight="900">
      9X
    </text>
    <text x="0" y="26" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="800" letter-spacing="1">
      PAYOUT
    </text>
  </g>

  <!-- 3 Color Chips Indicators Below -->
  <g transform="translate(225, 435)">
    <!-- Green Pill -->
    <rect x="-160" y="0" width="95" height="42" rx="21" fill="rgba(0, 230, 118, 0.2)" stroke="#00e676" stroke-width="2"/>
    <text x="-112" y="26" text-anchor="middle" fill="#00e676" font-family="sans-serif" font-size="14" font-weight="900">GREEN 2X</text>

    <!-- Violet Pill -->
    <rect x="-50" y="0" width="100" height="42" rx="21" fill="rgba(156, 39, 176, 0.2)" stroke="#ba68c8" stroke-width="2"/>
    <text x="0" y="26" text-anchor="middle" fill="#ba68c8" font-family="sans-serif" font-size="13" font-weight="900">VIOLET 4.5X</text>

    <!-- Red Pill -->
    <rect x="65" y="0" width="95" height="42" rx="21" fill="rgba(255, 23, 68, 0.2)" stroke="#ff1744" stroke-width="2"/>
    <text x="112" y="26" text-anchor="middle" fill="#ff5252" font-family="sans-serif" font-size="14" font-weight="900">RED 2X</text>
  </g>

  <!-- Number Balls (0 to 9) -->
  <g transform="translate(225, 500)">
    <circle cx="-135" cy="0" r="14" fill="#7c4dff"/><text x="-135" y="5" text-anchor="middle" fill="#fff" font-size="12" font-weight="900">0</text>
    <circle cx="-105" cy="0" r="14" fill="#00e676"/><text x="-105" y="5" text-anchor="middle" fill="#000" font-size="12" font-weight="900">1</text>
    <circle cx="-75" cy="0" r="14" fill="#ff1744"/><text x="-75" y="5" text-anchor="middle" fill="#fff" font-size="12" font-weight="900">2</text>
    <circle cx="-45" cy="0" r="14" fill="#00e676"/><text x="-45" y="5" text-anchor="middle" fill="#000" font-size="12" font-weight="900">3</text>
    <circle cx="-15" cy="0" r="14" fill="#ff1744"/><text x="-15" y="5" text-anchor="middle" fill="#fff" font-size="12" font-weight="900">4</text>
    <circle cx="15" cy="0" r="14" fill="#7c4dff"/><text x="15" y="5" text-anchor="middle" fill="#fff" font-size="12" font-weight="900">5</text>
    <circle cx="45" cy="0" r="14" fill="#ff1744"/><text x="45" y="5" text-anchor="middle" fill="#fff" font-size="12" font-weight="900">6</text>
    <circle cx="75" cy="0" r="14" fill="#00e676"/><text x="75" y="5" text-anchor="middle" fill="#000" font-size="12" font-weight="900">7</text>
    <circle cx="105" cy="0" r="14" fill="#ff1744"/><text x="105" y="5" text-anchor="middle" fill="#fff" font-size="12" font-weight="900">8</text>
    <circle cx="135" cy="0" r="14" fill="#00e676"/><text x="135" y="5" text-anchor="middle" fill="#000" font-size="12" font-weight="900">9</text>
  </g>

  <!-- Footer -->
  <g transform="translate(225, 555)">
    <text x="0" y="0" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1">
      30-SECOND COUNTDOWN · PROVABLY FAIR 99% RTP
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="100%" height="100%">
  <defs>
    <!-- Deep luxury dark background -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#111625"/>
      <stop offset="55%" stop-color="#080b14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>

    <!-- Glass gloss highlight -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Green Gem/Chip Gradient -->
    <radialGradient id="greenDisc" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#55f59c"/>
      <stop offset="45%" stop-color="#00c853"/>
      <stop offset="85%" stop-color="#007e33"/>
      <stop offset="100%" stop-color="#004d20"/>
    </radialGradient>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00e676" flood-opacity="0.45"/>
    </filter>

    <!-- Violet Gem/Chip Gradient -->
    <radialGradient id="violetDisc" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#9333ea"/>
      <stop offset="85%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <filter id="violetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a855f7" flood-opacity="0.45"/>
    </filter>

    <!-- Red Gem/Chip Gradient -->
    <radialGradient id="redDisc" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="45%" stop-color="#ff1744"/>
      <stop offset="85%" stop-color="#c62828"/>
      <stop offset="100%" stop-color="#5f0911"/>
    </radialGradient>
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ff1744" flood-opacity="0.45"/>
    </filter>

    <!-- Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3cc"/>
      <stop offset="30%" stop-color="#f5af19"/>
      <stop offset="70%" stop-color="#d49110"/>
      <stop offset="100%" stop-color="#fff3cc"/>
    </linearGradient>

    <!-- Soft Floor Shadow -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="450" height="600" fill="url(#bgGlow)"/>

  <!-- Subtle pedestal stage ring -->
  <ellipse cx="225" cy="460" rx="190" ry="45" fill="none" stroke="rgba(245, 175, 25, 0.15)" stroke-width="2"/>
  <ellipse cx="225" cy="460" rx="150" ry="35" fill="url(#floorShadow)"/>

  <!-- Three Iconic Glowing Betting Discs (Green, Violet, Red) -->

  <!-- 1. GREEN DISC (Left) -->
  <g transform="translate(110, 290)" filter="url(#greenGlow)">
    <circle cx="0" cy="0" r="72" fill="#022a12" stroke="url(#goldRim)" stroke-width="4"/>
    <circle cx="0" cy="0" r="64" fill="url(#greenDisc)"/>
    <!-- Concentric inner roulette groove -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="#00e676" opacity="0.9"/>
    <!-- Glass sheen -->
    <path d="M -54 -24 A 64 64 0 0 1 54 -24 Q 0 18 -54 -24 Z" fill="url(#glassGloss)"/>
  </g>

  <!-- 3. RED DISC (Right) -->
  <g transform="translate(340, 290)" filter="url(#redGlow)">
    <circle cx="0" cy="0" r="72" fill="#38060a" stroke="url(#goldRim)" stroke-width="4"/>
    <circle cx="0" cy="0" r="64" fill="url(#redDisc)"/>
    <!-- Concentric inner roulette groove -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="#ff1744" opacity="0.9"/>
    <!-- Glass sheen -->
    <path d="M -54 -24 A 64 64 0 0 1 54 -24 Q 0 18 -54 -24 Z" fill="url(#glassGloss)"/>
  </g>

  <!-- 2. VIOLET DISC (Elevated Centerpiece) -->
  <g transform="translate(225, 230)" filter="url(#violetGlow)">
    <circle cx="0" cy="0" r="84" fill="#25053d" stroke="url(#goldRim)" stroke-width="5"/>
    <circle cx="0" cy="0" r="75" fill="url(#violetDisc)"/>
    <!-- Concentric inner roulette groove -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="26" fill="#a855f7" opacity="0.95"/>
    <!-- Crown icon / star accent in center -->
    <polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" fill="#fff3cc"/>
    <!-- Glass sheen -->
    <path d="M -64 -28 A 75 75 0 0 1 64 -28 Q 0 22 -64 -28 Z" fill="url(#glassGloss)"/>
  </g>

  <!-- Clean Floating Gold Casino Chips at Bottom -->
  <g transform="translate(225, 430)">
    <!-- Chip 1 (Green) -->
    <ellipse cx="-70" cy="10" rx="36" ry="12" fill="#004d20" stroke="#00e676" stroke-width="2"/>
    <ellipse cx="-70" cy="6" rx="36" ry="12" fill="#00c853" stroke="url(#goldRim)" stroke-width="2"/>

    <!-- Chip 2 (Violet Center Top) -->
    <ellipse cx="0" cy="18" rx="42" ry="14" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
    <ellipse cx="0" cy="12" rx="42" ry="14" fill="#9333ea" stroke="url(#goldRim)" stroke-width="2.5"/>

    <!-- Chip 3 (Red) -->
    <ellipse cx="70" cy="10" rx="36" ry="12" fill="#5f0911" stroke="#ff1744" stroke-width="2"/>
    <ellipse cx="70" cy="6" rx="36" ry="12" fill="#ff1744" stroke="url(#goldRim)" stroke-width="2"/>
  </g>
</svg>

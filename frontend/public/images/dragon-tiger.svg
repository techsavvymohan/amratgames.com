<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="100%" height="100%">
  <defs>
    <!-- Dark luxury casino felt background -->
    <radialGradient id="feltBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f291e"/>
      <stop offset="60%" stop-color="#071912"/>
      <stop offset="100%" stop-color="#030c08"/>
    </radialGradient>

    <!-- Gold metallic gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="40%" stop-color="#f5af19"/>
      <stop offset="80%" stop-color="#d49110"/>
      <stop offset="100%" stop-color="#ffeaa7"/>
    </linearGradient>

    <!-- Red Dragon Card Gradient -->
    <linearGradient id="dragonCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Drop shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#f5af19" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Casino Felt Background -->
  <rect width="450" height="600" fill="url(#feltBg)"/>

  <!-- Elegant Gold Pinstripe Border -->
  <rect x="18" y="18" width="414" height="564" rx="18" fill="none" stroke="rgba(245, 175, 25, 0.25)" stroke-width="2"/>
  <rect x="26" y="26" width="398" height="548" rx="12" fill="none" stroke="rgba(245, 175, 25, 0.1)" stroke-width="1"/>

  <!-- Left: DRAGON SIDE (Red Ambient Light) -->
  <circle cx="120" cy="270" r="140" fill="#ff1744" opacity="0.12"/>
  <!-- Right: TIGER SIDE (Amber Ambient Light) -->
  <circle cx="330" cy="270" r="140" fill="#f5af19" opacity="0.12"/>

  <!-- Dragon Crest/Emblem Silhouette (Top Left) -->
  <g transform="translate(120, 110)">
    <circle cx="0" cy="0" r="46" fill="#1e0508" stroke="#ff1744" stroke-width="2.5"/>
    <!-- Stylized Dragon head icon -->
    <path d="M -18 12 Q -22 -14 0 -24 Q 22 -14 18 12 Q 10 24 0 16 Q -10 24 -18 12 Z" fill="#ff1744"/>
    <circle cx="-6" cy="-6" r="3" fill="#ffebee"/>
    <circle cx="6" cy="-6" r="3" fill="#ffebee"/>
    <text x="0" y="34" text-anchor="middle" fill="#ff5252" font-family="'Impact', sans-serif" font-size="14" letter-spacing="2">DRAGON</text>
  </g>

  <!-- Tiger Crest/Emblem Silhouette (Top Right) -->
  <g transform="translate(330, 110)">
    <circle cx="0" cy="0" r="46" fill="#201103" stroke="#f5af19" stroke-width="2.5"/>
    <!-- Stylized Tiger face icon -->
    <path d="M -20 -10 L -26 -24 L -10 -18 Q 0 -22 10 -18 L 26 -24 L 20 -10 Q 24 10 0 22 Q -24 10 -20 -10 Z" fill="#f5af19"/>
    <circle cx="-8" cy="-2" r="3" fill="#fff8e1"/>
    <circle cx="8" cy="-2" r="3" fill="#fff8e1"/>
    <text x="0" y="34" text-anchor="middle" fill="#fbbf24" font-family="'Impact', sans-serif" font-size="14" letter-spacing="2">TIGER</text>
  </g>

  <!-- TWO CRISP CASINO CARDS DUELING IN CENTER -->
  <!-- 1. LEFT CARD: DRAGON KING (K OF DIAMONDS) -->
  <g transform="translate(145, 330) rotate(-10)" filter="url(#cardShadow)">
    <rect x="-65" y="-105" width="130" height="210" rx="12" fill="url(#dragonCard)" stroke="#e2e8f0" stroke-width="2.5"/>
    <rect x="-57" y="-97" width="114" height="194" rx="8" fill="none" stroke="#ff1744" stroke-width="1.2" opacity="0.3"/>
    <!-- Top-left rank -->
    <text x="-48" y="-70" fill="#ff1744" font-family="'Georgia', serif" font-size="28" font-weight="900">K</text>
    <text x="-48" y="-46" fill="#ff1744" font-family="'Georgia', serif" font-size="22">♦</text>
    <!-- Center Big Diamond -->
    <text x="0" y="24" text-anchor="middle" fill="#ff1744" font-family="'Georgia', serif" font-size="70">♦</text>
    <!-- Bottom Badge -->
    <rect x="-42" y="68" width="84" height="22" rx="11" fill="#ffebee"/>
    <text x="0" y="83" text-anchor="middle" fill="#b71c1c" font-family="sans-serif" font-size="11" font-weight="900" letter-spacing="1">DRAGON</text>
  </g>

  <!-- 2. RIGHT CARD: TIGER QUEEN (Q OF SPADES) -->
  <g transform="translate(305, 330) rotate(10)" filter="url(#cardShadow)">
    <rect x="-65" y="-105" width="130" height="210" rx="12" fill="url(#dragonCard)" stroke="#e2e8f0" stroke-width="2.5"/>
    <rect x="-57" y="-97" width="114" height="194" rx="8" fill="none" stroke="#0f172a" stroke-width="1.2" opacity="0.3"/>
    <!-- Top-left rank -->
    <text x="-48" y="-70" fill="#0f172a" font-family="'Georgia', serif" font-size="28" font-weight="900">Q</text>
    <text x="-48" y="-46" fill="#0f172a" font-family="'Georgia', serif" font-size="22">♠</text>
    <!-- Center Big Spade -->
    <text x="0" y="24" text-anchor="middle" fill="#0f172a" font-family="'Georgia', serif" font-size="70">♠</text>
    <!-- Bottom Badge -->
    <rect x="-38" y="68" width="76" height="22" rx="11" fill="#fef3c7"/>
    <text x="0" y="83" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="11" font-weight="900" letter-spacing="1">TIGER</text>
  </g>

  <!-- CENTER VS BADGE -->
  <g transform="translate(225, 330)" filter="url(#emblemGlow)">
    <circle cx="0" cy="0" r="32" fill="#0b0f19" stroke="url(#gold)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="26" fill="#182234"/>
    <text x="0" y="8" text-anchor="middle" fill="url(#gold)" font-family="'Impact', sans-serif" font-size="24" font-weight="900" letter-spacing="1">
      VS
    </text>
  </g>

  <!-- SUBTLE BOTTOM CASINO BETTING SLOTS -->
  <g transform="translate(225, 500)">
    <rect x="-160" y="0" width="95" height="36" rx="8" fill="rgba(255, 23, 68, 0.15)" stroke="#ff1744" stroke-width="1.5"/>
    <text x="-112" y="23" text-anchor="middle" fill="#ff5252" font-family="sans-serif" font-size="12" font-weight="800">DRAGON</text>

    <rect x="-45" y="0" width="90" height="36" rx="8" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1.5"/>
    <text x="0" y="23" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="800">TIE</text>

    <rect x="65" y="0" width="95" height="36" rx="8" fill="rgba(245, 175, 25, 0.15)" stroke="#f5af19" stroke-width="1.5"/>
    <text x="112" y="23" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="800">TIGER</text>
  </g>
</svg>

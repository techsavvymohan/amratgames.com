<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="450" height="600" fill="url(#bg)"/>

  <!-- Perspective Grid Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="0" y1="450" x2="450" y2="450"/>
    <line x1="0" y1="500" x2="450" y2="500"/>
    <line x1="0" y1="540" x2="450" y2="540"/>
    <line x1="0" y1="570" x2="450" y2="570"/>
    <line x1="225" y1="350" x2="50" y2="600"/>
    <line x1="225" y1="350" x2="140" y2="600"/>
    <line x1="225" y1="350" x2="225" y2="600"/>
    <line x1="225" y1="350" x2="310" y2="600"/>
    <line x1="225" y1="350" x2="400" y2="600"/>
  </g>

  <!-- Glowing Multiplier Arc Beam -->
  <path d="M 50 480 Q 180 400 240 180" fill="none" stroke="url(#beamGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Digital Target Multiplier HUD -->
  <g transform="translate(225, 230)">
    <!-- Multiplier Display -->
    <text x="0" y="0" text-anchor="middle" fill="#00e676" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" font-weight="900" filter="url(#glow)" letter-spacing="2">
      1000.00x
    </text>
    <text x="0" y="45" text-anchor="middle" fill="#ffd700" font-family="sans-serif" font-size="20" font-weight="800" letter-spacing="4">
      TARGET REACHED
    </text>
  </g>

  <!-- Rocket / Probe Icon -->
  <g transform="translate(240, 150) rotate(-25)" filter="url(#glow)">
    <!-- Exhaust flame -->
    <polygon points="-8,40 0,75 8,40" fill="#ff5722"/>
    <polygon points="-5,40 0,60 5,40" fill="#ffd700"/>
    <!-- Rocket Body -->
    <path d="M 0 0 C -15 25 -12 42 0 45 C 12 42 15 25 0 0 Z" fill="url(#rocketGrad)"/>
    <!-- Fins -->
    <polygon points="-12,32 -25,48 -10,44" fill="#ff3d00"/>
    <polygon points="12,32 25,48 10,44" fill="#ff3d00"/>
    <!-- Window -->
    <circle cx="0" cy="22" r="5" fill="#0d1b2a"/>
  </g>

  <!-- Header Branding / Game Name -->
  <g transform="translate(225, 80)">
    <rect x="-80" y="-30" width="160" height="32" rx="16" fill="rgba(255, 215, 0, 0.15)" stroke="#ffd700" stroke-width="1.5"/>
    <text x="0" y="-9" text-anchor="middle" fill="#ffd700" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="2">
      AMRAT ORIGINAL
    </text>
    <text x="0" y="42" text-anchor="middle" fill="#ffffff" font-family="'Impact', sans-serif" font-size="52" font-weight="900" letter-spacing="3">
      LIMBO
    </text>
  </g>

  <!-- Bottom Features -->
  <g transform="translate(225, 540)">
    <text x="0" y="0" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15" font-weight="700" letter-spacing="1">
      UP TO 1,000,000X MULTIPLIER · 99% RTP
    </text>
  </g>
</svg>
